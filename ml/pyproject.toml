[project]
name = "compose-keyboard-swipe"
version = "1.2.0"
description = "Layout-agnostic neural swipe encoder: training, evaluation, and export"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26,<3",
    "orjson>=3.9",
    "huggingface_hub>=0.24",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
